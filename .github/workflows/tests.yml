name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write  # Required for Flakiness.io OIDC upload

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: deadmanswitch/go.mod
          cache-dependency-path: deadmanswitch/go.sum

      - name: Install UPX
        run: sudo apt-get install -y upx

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          standalone: true
          cache: true

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:deadmanswitch
      - run: docker pull postgres:latest
      - uses: flakiness/authenticate-fork-prs@v1
        with:
          flakiness-project: flakiness/podkeeper
      - run: pnpm test
