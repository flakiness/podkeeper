name: Publish to NPM

on:
  release:
    types: [published]

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish-to-npm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: deadmanswitch/go.mod
          cache-dependency-path: deadmanswitch/go.sum

      - name: Install UPX
        run: sudo apt-get install -y upx

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          standalone: true
          cache: true

      - name: Build
        run: |
          pnpm i --frozen-lockfile
          pnpm build
          pnpm build:deadmanswitch

      - name: Make sure tests pass before publishing
        run: |
          docker pull postgres:latest
          pnpm test

      - name: Publish
        run: |
          VERSION=${GITHUB_REF_NAME#v}

          if [[ "$VERSION" == *"-"* ]]; then
            echo "Publishing prerelease to @next"
            pnpm publish --access=public --no-git-checks --tag next
          else
            echo "Publishing stable to @latest"
            pnpm publish --access=public --no-git-checks
          fi
